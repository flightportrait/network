<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One airframe's observed life: identity and the flight log in one
     /v1/airframes/{hex} call, photo from planespotters (credited).
     The legs are what the open trace archives actually show, gaps
     stated as gaps. No schedules, no inference, no "maintenance":
     observation only. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airframe. FlightPortrait network</title>
<meta name="description" content="One airframe's observed flight log, from the FlightPortrait network's antennas.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="FlightPortrait network">
<meta property="og:title" content="Airframe · FlightPortrait network">
<meta property="og:description" content="One airframe's observed flight log, from the FlightPortrait network's antennas.">
<meta property="og:image" content="https://flightportrait.com/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F5F1E6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#F5F1E6; --ink:#221F1A; --red:#B8402E; --green:#3D7A50;
    --line:rgba(34,31,26,.14); --quiet:rgba(34,31,26,.72);
    --card:#FAF7EE;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);overflow-x:hidden;
    font:17px/1.6 Palatino,'Palatino Linotype','Book Antiqua',Georgia,serif;
    -webkit-font-smoothing:antialiased}
  .caps{font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;letter-spacing:.1em}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .topbar{position:sticky;top:0;z-index:5;background:var(--paper)}
  .topbar .wrap{max-width:1000px;display:flex;align-items:center;
    justify-content:space-between;height:64px;gap:18px}
  .wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;
    color:var(--ink);font-size:17px}
  .wordmark img{width:24px;height:24px;display:block;border-radius:5px}
  .topnav{display:flex;gap:22px;align-items:center;overflow-x:auto}
  .topnav a{color:var(--ink);text-decoration:none;font-size:15px;
    white-space:nowrap}
  .topnav a:hover{color:var(--red)}
  main a{color:var(--ink)}

  .top{display:grid;grid-template-columns:1fr;gap:24px 48px;
    padding:36px 0 0;align-items:start}
  @media (min-width:760px){
    .top{grid-template-columns:minmax(0,1fr) 340px}
    .top .photo{grid-column:2;grid-row:1 / span 2;margin:6px 0 0}
  }
  .head{grid-column:1}
  h1{font-size:44px;line-height:1.1;font-weight:400}
  .sub{font-size:18px;color:var(--quiet);margin-top:4px}
  .photo{margin:8px 0 0;display:none}
  .photo.show{display:block}
  .photo img{width:100%;height:auto;border-radius:6px;display:block;
    border:1px solid var(--line)}
  .credit{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;
    letter-spacing:.04em;color:var(--quiet);margin-top:5px}
  .credit a{color:var(--quiet)}

  .stats{grid-column:1;display:flex;gap:28px 36px;flex-wrap:wrap;padding:8px 0 0}
  table.legs .city{display:block;font-size:13px;color:var(--quiet);line-height:1.3}
  table.legs .tz{font-size:12px;color:var(--quiet);margin-left:5px}
  .stat .n{font-size:28px;line-height:1;display:block}
  .stat .caps{color:var(--quiet);display:block;margin-top:6px}

  .log{padding:32px 0 60px}
  .log h2{font-size:19px;font-weight:400;margin-bottom:10px}
  .tablewrap{overflow-x:auto}
  table.legs{width:100%;border-collapse:collapse;
    font-variant-numeric:tabular-nums;font-size:16px}
  table.legs th{text-align:left;font-weight:400;color:var(--quiet);
    padding:8px 12px 8px 0;border-bottom:1px solid var(--ink);
    white-space:nowrap}
  table.legs td{padding:8px 12px 8px 0;vertical-align:top;
    border-bottom:1px solid rgba(34,31,26,.08);white-space:nowrap}
  table.legs th.num,table.legs td.num{text-align:right;padding-right:0}
  table.legs th:last-child,table.legs td:last-child{padding-right:0}
  table.legs td.date{color:var(--quiet)}
  table.legs td.flight a{color:var(--ink);text-decoration:none}
  table.legs td.flight a:hover{color:var(--red)}
  table.legs tr.first td{border-top:1px solid rgba(34,31,26,.18)}
  table.legs tr.gap td{color:var(--quiet);font-style:italic;
    padding:10px 0}
  .empty{padding:40px 0;color:var(--quiet)}
  .note{color:var(--quiet);font-size:14px;padding:16px 0 0}
  .livelink{padding:14px 0 0;display:none}
  .livelink.show{display:block}
  a.textlink{display:inline-flex;align-items:center;gap:9px;
    color:var(--red);text-decoration:none;white-space:nowrap}
  a.textlink::after{content:"\2192"}
  a.textlink:hover{text-decoration:underline}
  .searchbox{position:relative;flex:0 1 240px;min-width:150px}
  .searchbox input{width:100%;font:14px 'Helvetica Neue',Arial,sans-serif;
    padding:6px 11px;border:1px solid rgba(34,31,26,.22);border-radius:999px;
    background:var(--card);color:var(--ink);outline:none}
  .searchbox input::placeholder{color:var(--quiet)}
  .searchbox input:focus{border-color:var(--ink)}
  .s-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 8px 24px rgba(34,31,26,.12);max-height:60vh;overflow:auto;
    min-width:280px}
  .s-kind{padding:10px 12px 4px;color:var(--quiet)}
  .s-row{display:flex;align-items:center;gap:12px;padding:7px 12px;text-decoration:none;color:var(--ink)}
  .s-pic{width:34px;height:34px;flex:0 0 34px;object-fit:contain;border-radius:6px}
  .s-text{min-width:0}
  .s-row:hover,.s-row.active{background:rgba(34,31,26,.06)}
  .s-label{display:block;font-size:16px}
  .s-detail{display:block;font-size:13px;color:var(--quiet)}
  .s-empty{padding:14px 12px;color:var(--quiet);font-size:15px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="/"><img src="/apple-touch-icon.png" alt="">FlightPortrait&nbsp;<span style="color:var(--quiet)">network</span></a>
    <div class="searchbox"><input id="q" type="search" placeholder="Search" autocomplete="off" spellcheck="false"><div class="s-list" id="q-list" hidden></div></div>
    <nav class="topnav" aria-label="Network">
      <a href="/network/">Live map</a>
      <a href="/network/?mode=airlines">Airlines</a>
      <a href="/network/?mode=join">Join</a>
      <a href="https://docs.flightportrait.com">Docs</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="top">
      <div class="head">
        <h1 id="reg">&nbsp;</h1>
        <div class="sub" id="ident"></div>
        <div class="livelink" id="livelink"><a class="textlink" id="livehref" href="/network/">On the map now</a></div>
      </div>
      <div class="stats" id="stats" style="display:none">
        <div class="stat"><span class="n" id="s-legs"></span><span class="caps">flights observed</span></div>
        <div class="stat"><span class="n" id="s-airports"></span><span class="caps">airports</span></div>
        <div class="stat"><span class="n" id="s-pair"></span><span class="caps">most flown</span></div>
        <div class="stat"><span class="n" id="s-days"></span><span class="caps">days observed</span></div>
        <div class="stat"><span class="n" id="s-first"></span><span class="caps">first seen</span></div>
      </div>
      <div class="photo" id="photo"></div>
    </div>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  // Talks to the instance we operate. For local hacking, set
  // window.FP_API before this script.
  var API = window.FP_API || "https://data.flightportrait.com";
  var hex = (new URLSearchParams(location.search).get("hex") ||
             location.hash.slice(1) || "").toLowerCase();

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"'\/]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "/": "&#47;" }[c];
    });
  }
  function httpsOnly(u) {
    u = String(u == null ? "" : u);
    return /^https:\/\//i.test(u) ? u : "";
  }

  if (!/^[0-9a-f]{6}$/.test(hex)) {
    el("reg").textContent = "Airframe";
    el("log").innerHTML = "<div class='empty'>No aircraft given. " +
      "Open an aircraft from <a href='/network/'>the live map</a> and " +
      "follow its history link.</div>";
    return;
  }

  var typeNames = {}, apts = {};
  var typesReady = Promise.all([
    fetch("assets/types.json").then(function (r) { return r.json(); })
      .then(function (d) { typeNames = d; }).catch(function () {}),
    fetch("assets/airports.json").then(function (r) { return r.json(); })
      .then(function (d) { apts = d; }).catch(function () {})
  ]);
  function cityOf(code) { var a = apts[code]; return a ? a[0] : ""; }
  function tzOf(code) { var a = apts[code]; return a && a[5] ? a[5] : null; }
  // HH:MM in the airport's own zone, with its offset; UTC when unknown
  function localTime(ts, code) {
    if (!ts) return "";
    var tz = tzOf(code), d = new Date(ts * 1000), parts;
    try {
      parts = new Intl.DateTimeFormat("en-GB", { timeZone: tz || "UTC",
        hour: "2-digit", minute: "2-digit", hour12: false,
        timeZoneName: "shortOffset" }).formatToParts(d);
    } catch (e) {
      parts = new Intl.DateTimeFormat("en-GB", { timeZone: tz || "UTC",
        hour: "2-digit", minute: "2-digit", hour12: false,
        timeZoneName: "short" }).formatToParts(d);
    }
    var hm = "", zone = "";
    parts.forEach(function (x) {
      if (x.type === "hour" || x.type === "minute") hm += (hm ? ":" : "") + x.value;
      if (x.type === "timeZoneName") zone = x.value.replace(/^GMT/, "UTC");
    });
    return hm + "<span class='tz'>" + esc(zone) + "</span>";
  }
  function place(code) {
    var c = cityOf(code);
    return esc(code) + (c ? "<span class='city'>" + esc(c) + "</span>" : "");
  }

  // photo, credited (visitor's browser fetches, tar1090-style)
  fetch("https://api.planespotters.net/pub/photos/hex/" + hex)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var p = (d.photos || [])[0];
      if (!p) return;
      el("photo").innerHTML = "<a href='" + esc(httpsOnly(p.link)) +
        "' target='_blank' rel='noopener'><img src='" +
        esc(httpsOnly(p.thumbnail_large.src)) + "' alt=''></a>" +
        "<div class='credit'>&copy; " + esc(p.photographer) +
        " &middot; <a href='" + esc(httpsOnly(p.link)) +
        "' target='_blank' rel='noopener'>planespotters.net</a></div>";
      el("photo").className = "photo show";
    }).catch(function () {});

  // is it in the network's sky right now?
  fetch(API + "/v1/aircraft").then(function (r) { return r.json(); })
    .then(function (d) {
      if ((d.aircraft || []).some(function (a) { return a.hex === hex; })) {
        el("livehref").href = "/network/#" + hex;
        el("livelink").className = "livelink show";
      }
    }).catch(function () {});

  function dur(a, b) {
    if (!a || !b || b <= a) return "";
    var m = Math.round((b - a) / 60);
    return Math.floor(m / 60) + "h" + ("0" + (m % 60)).slice(-2);
  }

  fetch(API + "/v1/airframes/" + hex).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (d) {
    typesReady.then(function () { render(d); });
  }).catch(function () {
    el("reg").textContent = hex.toUpperCase();
    el("log").innerHTML = "<div class='empty'>No flight log for this " +
      "aircraft in the archive window. The log grows nightly.</div>";
  });

  function render(d) {
    el("reg").textContent = d.reg || d.hex.toUpperCase();
    var entry = d.type && typeNames[d.type];
    var operator = d.operator || (d.airline && d.airline.name);
    var bits = [(entry && entry[0]) || d.type_name || d.type, d.hex.toUpperCase()];
    var icao = d.operator_icao || (d.airline && d.airline.icao);
    el("ident").innerHTML = bits.filter(Boolean).map(esc).join(" · ") +
      (operator ? " · " + (icao ? "<a href='airline.html?icao=" + esc(icao) + "' style='color:inherit;text-decoration:none'>" + esc(operator) + "</a>" : esc(operator)) : "");
    d.legs = d.legs || [];
    if (!d.legs.length) {
      el("log").innerHTML = "<div class='empty'>No flight log for this " +
        "aircraft in the archive window. The log grows nightly.</div>";
      return;
    }

    // stats
    var airports = {}, pairs = {};
    d.legs.forEach(function (l) {
      airports[l.org] = airports[l.dst] = 1;
      var key = [l.org, l.dst].sort().join("–");
      pairs[key] = (pairs[key] || 0) + 1;
    });
    var topPair = Object.keys(pairs).sort(function (a, b) {
      return pairs[b] - pairs[a];
    })[0] || "–";
    el("s-legs").textContent = d.legs.length;
    el("s-airports").textContent = Object.keys(airports).length;
    el("s-pair").textContent = topPair;
    var days = {};
    d.legs.forEach(function (l) { days[l.date] = 1; });
    el("s-days").textContent = Object.keys(days).length;
    var firstDate = d.legs[d.legs.length - 1].date;
    el("s-first").textContent = firstDate;
    el("stats").style.display = "";

    // the log: one row per flight, the date once per day, gaps said out loud
    var log = el("log");
    var html = "<h2>Flight log</h2><div class='tablewrap'><table class='legs'>" +
      "<thead><tr><th>Date</th><th>Flight</th><th>From</th><th>To</th>" +
      "<th>Departed</th><th>Arrived</th><th class='num'>Duration</th>" +
      "<th class='num'>Max altitude</th></tr></thead><tbody>";
    var lastDate = null;
    d.legs.forEach(function (l) {
      var first = l.date !== lastDate;
      if (first && lastDate) {
        var gapDays = Math.round(
          (Date.parse(lastDate) - Date.parse(l.date)) / 86400000) - 1;
        if (gapDays >= 3) {
          html += "<tr class='gap'><td colspan='8'>quiet for " + gapDays +
                  " days</td></tr>";
        }
      }
      var from = place(l.org);
      var to = l.org === l.dst ? "<span class='city'>circuit</span>" : place(l.dst);
      html += "<tr" + (first ? " class='first'" : "") + ">" +
        "<td class='date'>" + (first ? esc(l.date) : "") + "</td>" +
        "<td class='flight'>" + (l.callsign ? "<a href='flight.html?callsign=" + esc(l.callsign) + "'>" + esc(l.callsign) + "</a>" : "") + "</td>" +
        "<td>" + from + "</td><td>" + to + "</td>" +
        "<td>" + localTime(l.dep_ts, l.org) + "</td>" +
        "<td>" + (l.arr_ts ? localTime(l.arr_ts, l.dst) : "") + "</td>" +
        "<td class='num'>" + dur(l.dep_ts, l.arr_ts) + "</td>" +
        "<td class='num'>" +
        (l.max_alt ? Number(l.max_alt).toLocaleString() + " ft" : "") +
        "</td></tr>";
      lastDate = l.date;
    });
    html += "</tbody></table></div>";
    html += "<div class='note'>Times are local to each airport. Observed flights from openly " +
      "licensed trace archives, last " + (d.window_days || 60) +
      " days; a quiet day means the archives did not see it, nothing " +
      "more. Data ODbL.</div>";
    log.innerHTML = html;
  }
})();
</script>
<script src="assets/search.js"></script>
<script>fpSearch(document.getElementById("q"), document.getElementById("q-list"));</script>
</body>
</html>
