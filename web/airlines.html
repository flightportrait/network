<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Airlines is a mode of the network page now; this stub forwards old
     links, keeping their airline/view/leg parameters. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airlines. The FlightPortrait network</title>
<script>
  var q = new URLSearchParams(location.search);
  q.set("mode", "airlines");
  location.replace("/network/?" + q.toString());
</script>
<meta http-equiv="refresh" content="0;url=/network/?mode=airlines">
</head>
<body>
<p><a href="/network/?mode=airlines">Airlines moved to the network map.</a></p>
</body>
</html>
