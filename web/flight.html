<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- One airframe's observed life: identity and the flight log in one
     /v1/airframes/{hex} call, photo from planespotters (credited).
     The legs are what the open trace archives actually show, gaps
     stated as gaps. No schedules, no inference, no "maintenance":
     observation only. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight · FlightPortrait network</title>
<meta name="theme-color" content="#F5F1E6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root{
    --paper:#F5F1E6; --ink:#221F1A; --red:#B8402E; --green:#3D7A50;
    --line:rgba(34,31,26,.14); --quiet:rgba(34,31,26,.72);
    --card:#FAF7EE;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);overflow-x:hidden;
    font:17px/1.6 Palatino,'Palatino Linotype','Book Antiqua',Georgia,serif;
    -webkit-font-smoothing:antialiased}
  .caps{font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:12px;letter-spacing:.1em}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  .topbar{position:sticky;top:0;z-index:5;background:var(--paper)}
  .topbar .wrap{max-width:1000px;display:flex;align-items:center;
    justify-content:space-between;height:64px;gap:18px}
  .wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;
    color:var(--ink);font-size:17px}
  .wordmark img{width:24px;height:24px;display:block;border-radius:5px}
  .topnav{display:flex;gap:22px;align-items:center;overflow-x:auto}
  .topnav a{color:var(--ink);text-decoration:none;font-size:15px;
    white-space:nowrap}
  .topnav a:hover{color:var(--red)}
  main a{color:var(--ink)}

  .top{display:grid;grid-template-columns:1fr;gap:24px 48px;
    padding:36px 0 0;align-items:start}
  @media (min-width:760px){
    .top{grid-template-columns:minmax(0,1fr) 340px}
    .top .photo{grid-column:2;grid-row:1 / span 2;margin:6px 0 0}
  }
  .head{grid-column:1}
  h1{font-size:44px;line-height:1.1;font-weight:400}
  .sub{font-size:18px;color:var(--quiet);margin-top:4px}
  .photo{margin:8px 0 0;display:none}
  .photo.show{display:block}
  .photo img{width:100%;height:auto;border-radius:6px;display:block;
    border:1px solid var(--line)}
  .credit{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;
    letter-spacing:.04em;color:var(--quiet);margin-top:5px}
  .credit a{color:var(--quiet)}

  .stats{grid-column:1;display:flex;gap:28px 36px;flex-wrap:wrap;padding:8px 0 0}
  table.legs .city{display:block;font-size:13px;color:var(--quiet);line-height:1.3}
  table.legs .tz{font-size:12px;color:var(--quiet);margin-left:5px}
  .stat .n{font-size:28px;line-height:1;display:block}
  .stat .caps{color:var(--quiet);display:block;margin-top:6px}

  .log{padding:32px 0 60px}
  .log h2{font-size:19px;font-weight:400;margin-bottom:10px}
  .tablewrap{overflow-x:auto}
  table.legs{width:100%;border-collapse:collapse;
    font-variant-numeric:tabular-nums;font-size:16px}
  table.legs th{text-align:left;font-weight:400;color:var(--quiet);
    padding:8px 12px 8px 0;border-bottom:1px solid var(--ink);
    white-space:nowrap}
  table.legs td{padding:8px 12px 8px 0;vertical-align:top;
    border-bottom:1px solid rgba(34,31,26,.08);white-space:nowrap}
  table.legs th.num,table.legs td.num{text-align:right;padding-right:0}
  table.legs th:last-child,table.legs td:last-child{padding-right:0}
  table.legs td.date{color:var(--quiet)}
  table.legs td.flight{color:var(--quiet)}
  table.legs tr.first td{border-top:1px solid rgba(34,31,26,.18)}
  table.legs tr.gap td{color:var(--quiet);font-style:italic;
    padding:10px 0}
  .empty{padding:40px 0;color:var(--quiet)}
  .note{color:var(--quiet);font-size:14px;padding:16px 0 0}
  .livelink{padding:14px 0 0;display:none}
  .livelink.show{display:block}
  a.textlink{display:inline-flex;align-items:center;gap:9px;
    color:var(--red);text-decoration:none;white-space:nowrap}
  a.textlink::after{content:"\2192"}
  a.textlink:hover{text-decoration:underline}
  .routeline{font-size:22px;margin-top:14px;line-height:1.4}
  .routeline .arrow{color:var(--quiet);margin:0 10px}
  .routeline .city{color:var(--quiet);font-size:16px;margin-left:6px}
  .tail{width:40px;height:40px;vertical-align:middle;margin-right:10px;border-radius:6px}
  section.block{padding:32px 0 0}
  section.block h2{font-size:19px;font-weight:400;margin-bottom:10px}
  table.legs a{color:var(--ink);text-decoration:none}
  table.legs a:hover{color:var(--red)}
  .foot{padding:0 0 60px}
  .searchbox{position:relative;flex:0 1 300px;min-width:160px}
  .searchbox input{width:100%;font:15px 'Helvetica Neue',Arial,sans-serif;
    padding:8px 12px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--ink);outline:none}
  .searchbox input:focus{border-color:var(--ink)}
  .s-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    box-shadow:0 8px 24px rgba(34,31,26,.12);max-height:60vh;overflow:auto;
    min-width:280px}
  .s-kind{padding:10px 12px 4px;color:var(--quiet)}
  .s-row{display:block;padding:7px 12px;text-decoration:none;color:var(--ink)}
  .s-row:hover,.s-row.active{background:rgba(34,31,26,.06)}
  .s-label{display:block;font-size:16px}
  .s-detail{display:block;font-size:13px;color:var(--quiet)}
  .s-empty{padding:14px 12px;color:var(--quiet);font-size:15px}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="wordmark" href="/"><img src="/apple-touch-icon.png" alt="">FlightPortrait&nbsp;<span style="color:var(--quiet)">network</span></a>
    <div class="searchbox"><input id="q" type="search" placeholder="Registration, flight, airport, airline" autocomplete="off" spellcheck="false"><div class="s-list" id="q-list" hidden></div></div>
    <nav class="topnav" aria-label="Network">
      <a href="/network/">Live map</a>
      <a href="/network/?mode=airlines">Airlines</a>
      <a href="/network/?mode=join">Join</a>
      <a href="/network/search.html">Search</a>
      <a href="https://docs.flightportrait.com">Docs</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="top">
      <div class="head">
        <h1 id="callsign">&nbsp;</h1>
        <div class="sub" id="ident"></div>
        <div class="routeline" id="routeline"></div>
        <div class="livelink" id="livelink"><a class="textlink" id="livehref" href="/network/">In the air now</a></div>
      </div>
      <div class="stats" id="stats" style="display:none">
        <div class="stat"><span class="n" id="s-flights"></span><span class="caps">flights observed</span></div>
        <div class="stat"><span class="n" id="s-days"></span><span class="caps">days flown</span></div>
        <div class="stat"><span class="n" id="s-cadence"></span><span class="caps">how often</span></div>
        <div class="stat"><span class="n" id="s-aircraft"></span><span class="caps">aircraft used</span></div>
        <div class="stat"><span class="n" id="s-last"></span><span class="caps">last seen</span></div>
      </div>
    </div>
    <div id="body"></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var API = window.FP_API || "https://data.flightportrait.com";
  var callsign = (new URLSearchParams(location.search).get("callsign") ||
                  location.hash.slice(1) || "").toUpperCase().trim();

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"'\/]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "/": "&#47;" }[c];
    });
  }

  if (!/^[A-Z0-9]{3,8}$/.test(callsign)) {
    el("callsign").textContent = "Flight";
    el("body").innerHTML = "<div class='empty'>No flight given. " +
      "Open an aircraft from <a href='/network/'>the live map</a> and " +
      "follow its flight number.</div>";
    return;
  }
  el("callsign").textContent = callsign;

  var typeNames = {}, apts = {}, tails = {};
  var ready = Promise.all([
    fetch("assets/types.json").then(function (r) { return r.json(); })
      .then(function (d) { typeNames = d; }).catch(function () {}),
    fetch("assets/airports.json").then(function (r) { return r.json(); })
      .then(function (d) { apts = d; }).catch(function () {}),
    fetch("assets/airline-tails/manifest.json").then(function (r) { return r.json(); })
      .then(function (d) { tails = d; }).catch(function () {})
  ]);
  function cityOf(code) { var a = apts[code]; return a ? a[0] : ""; }
  function tzOf(code) { var a = apts[code]; return a && a[5] ? a[5] : null; }
  function typeName(code) { var e = code && typeNames[code]; return e ? e[0] : (code || ""); }
  function localTime(ts, code) {
    if (!ts) return "";
    var tz = tzOf(code), d = new Date(ts * 1000), parts;
    try {
      parts = new Intl.DateTimeFormat("en-GB", { timeZone: tz || "UTC",
        hour: "2-digit", minute: "2-digit", hour12: false,
        timeZoneName: "shortOffset" }).formatToParts(d);
    } catch (e) {
      parts = new Intl.DateTimeFormat("en-GB", { timeZone: tz || "UTC",
        hour: "2-digit", minute: "2-digit", hour12: false,
        timeZoneName: "short" }).formatToParts(d);
    }
    var hm = "", zone = "";
    parts.forEach(function (x) {
      if (x.type === "hour" || x.type === "minute") hm += (hm ? ":" : "") + x.value;
      if (x.type === "timeZoneName") zone = x.value.replace(/^GMT/, "UTC");
    });
    return hm + "<span class='tz'>" + esc(zone) + "</span>";
  }
  function place(code) {
    var c = cityOf(code);
    return esc(code) + (c ? "<span class='city'>" + esc(c) + "</span>" : "");
  }
  function dur(a, b) {
    if (!a || !b || b <= a) return "";
    var m = Math.round((b - a) / 60);
    return Math.floor(m / 60) + "h" + ("0" + (m % 60)).slice(-2);
  }
  function cadence(days, windowDays) {
    if (!days || !windowDays) return "";
    var perWeek = days / (windowDays / 7);
    if (perWeek >= 6.5) return "daily";
    if (perWeek >= 1) return Math.round(perWeek) + "× a week";
    var perMonth = days / (windowDays / 30);
    if (perMonth >= 1) return Math.round(perMonth) + "× a month";
    return "rarely";
  }

  // airline from the callsign prefix
  var prefix = /^([A-Z]{3})\d/.exec(callsign);
  if (prefix) {
    fetch(API + "/v1/airlines/" + prefix[1]).then(function (r) { return r.ok ? r.json() : null; })
      .then(function (a) {
        if (!a) return;
        ready.then(function () {
          var entry = tails[prefix[1]], rel = entry && entry["64"];
          el("ident").innerHTML = (rel ? "<img class='tail' alt='' src='assets/airline-tails/" + esc(rel) + "'>" : "") +
            esc(a.name) + (a.iata ? " · " + esc(a.iata) + callsign.slice(3) : "");
        });
      }).catch(function () {});
  }

  // in the air now?
  fetch(API + "/v1/aircraft").then(function (r) { return r.json(); })
    .then(function (d) {
      var a = (d.aircraft || []).filter(function (x) { return (x.flight || "").trim() === callsign; })[0];
      if (a) {
        el("livehref").href = "/network/#" + a.hex;
        el("livelink").className = "livelink show";
      }
    }).catch(function () {});

  fetch(API + "/v1/flights/" + encodeURIComponent(callsign)).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function (d) { ready.then(function () { render(d); }); })
    .catch(function () {
      el("body").innerHTML = "<div class='empty'>No log for this flight " +
        "number in the archive window. The log grows nightly.</div>";
    });

  function render(d) {
    var legs = d.legs || [], recent = d.recent || [], fleet = d.aircraft || [];
    var route = d.route || [];
    if (route.length) {
      el("routeline").innerHTML = route.map(function (c) {
        return esc(c) + (cityOf(c) ? "<span class='city'>" + esc(cityOf(c)) + "</span>" : "");
      }).join("<span class='arrow'>\u2192</span>");
    }
    if (!legs.length && !recent.length) {
      el("body").innerHTML = "<div class='empty'>No log for this flight " +
        "number in the archive window. The log grows nightly.</div>";
      return;
    }
    var flights = 0, days = 0, last = "";
    legs.forEach(function (l) {
      flights += l.flights || 0; days = Math.max(days, l.days || 0);
      if (l.last > last) last = l.last;
    });
    el("s-flights").textContent = flights;
    el("s-days").textContent = days;
    el("s-cadence").textContent = cadence(days, d.window_days) || "–";
    el("s-aircraft").textContent = fleet.length;
    el("s-last").textContent = last || "–";
    el("stats").style.display = "";

    var html = "";
    // the route, leg by leg, with typical local times
    html += "<section class='block'><h2>Route</h2><div class='tablewrap'><table class='legs'>" +
      "<thead><tr><th>From</th><th>To</th><th>Typical departure</th><th>Typical arrival</th>" +
      "<th>Aircraft</th><th class='num'>Flights</th><th class='num'>Days</th><th>Last</th></tr></thead><tbody>";
    legs.forEach(function (l) {
      html += "<tr><td>" + place(l.org) + "</td><td>" + place(l.dst) + "</td>" +
        "<td>" + (l.dep ? esc(l.dep) + "<span class='tz'>local</span>" : "") + "</td>" +
        "<td>" + (l.arr ? esc(l.arr) + "<span class='tz'>local</span>" : "") + "</td>" +
        "<td>" + esc(typeName(l.type)) + "</td>" +
        "<td class='num'>" + (l.flights || "") + "</td><td class='num'>" + (l.days || "") + "</td>" +
        "<td>" + esc(l.last || "") + "</td></tr>";
    });
    html += "</tbody></table></div></section>";

    // recent flights, each in its airports' local time
    if (recent.length) {
      html += "<section class='block'><h2>Recent flights</h2><div class='tablewrap'><table class='legs'>" +
        "<thead><tr><th>Date</th><th>From</th><th>To</th><th>Departed</th><th>Arrived</th>" +
        "<th class='num'>Duration</th></tr></thead><tbody>";
      recent.forEach(function (l) {
        html += "<tr><td class='date'>" + esc(l.date) + "</td>" +
          "<td>" + place(l.org) + "</td><td>" + place(l.dst) + "</td>" +
          "<td>" + localTime(l.dep_ts, l.org) + "</td>" +
          "<td>" + (l.arr_ts ? localTime(l.arr_ts, l.dst) : "") + "</td>" +
          "<td class='num'>" + dur(l.dep_ts, l.arr_ts) + "</td></tr>";
      });
      html += "</tbody></table></div></section>";
    }

    // the aircraft that flew it
    if (fleet.length) {
      html += "<section class='block'><h2>Aircraft on this flight</h2><div class='tablewrap'><table class='legs'>" +
        "<thead><tr><th>Registration</th><th>Type</th><th class='num'>Flights</th></tr></thead><tbody>";
      fleet.forEach(function (a) {
        html += "<tr><td><a href='plane.html?hex=" + esc(a.hex) + "'>" + esc(a.reg || a.hex.toUpperCase()) + "</a></td>" +
          "<td>" + esc(typeName(a.type)) + "</td><td class='num'>" + (a.flights || "") + "</td></tr>";
      });
      html += "</tbody></table></div></section>";
    }
    html += "<div class='note foot'>Times are local to each airport. Observed flights from openly " +
      "licensed trace archives, last " + (d.window_days || 60) + " days; a quiet day means the " +
      "archives did not see it, nothing more. Data ODbL.</div>";
    el("body").innerHTML = html;
  }
})();
</script>
<script src="assets/search.js"></script>
<script>fpSearch(document.getElementById("q"), document.getElementById("q-list"));</script>
</body>
</html>
