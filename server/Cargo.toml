[workspace]
resolver = "2"
members = ["crates/netbench", "crates/networkd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/flightportrait/network"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
form_urlencoded = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.11"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.8"
rand_chacha = "0.3"
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"

[profile.release]
debug = true            # profiling a live server wants the symbols
